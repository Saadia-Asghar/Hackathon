# Deploys web/ (Next.js) + api/ (Azure Functions) to Azure Static Web Apps on every push to main.
# Setup once: create a Static Web App in the Azure portal (Free plan), copy its deployment token,
# then add it in GitHub: Settings > Secrets and variables > Actions > AZURE_STATIC_WEB_APPS_API_TOKEN.
# Add the Azure keys from api/local.settings.example.json in the Static Web App > Environment variables.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ""
